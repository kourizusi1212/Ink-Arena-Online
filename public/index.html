<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INK ARENA ONLINE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="menu" class="screen">
  <div class="panel">
    <h1>INK ARENA</h1>
    <p>オンライン・インクバトル</p>
    <input id="player" maxlength="16" placeholder="プレイヤー名" value="Player">
    <div class="tabs">
      <button class="tab active" data-tab="quick">クイック</button>
      <button class="tab" data-tab="rooms">部屋一覧</button>
      <button class="tab" data-tab="create">部屋作成</button>
    </div>

    <section id="quick">
      <button id="quickBtn" disabled>クイックマッチ</button>
    </section>

    <section id="rooms" hidden>
      <button id="refreshBtn" class="smallBtn">部屋一覧を更新</button>
      <div id="roomList"></div>
    </section>

    <section id="create" hidden>
      <input id="roomName" maxlength="24" value="My Room" placeholder="部屋名">
      <select id="map"><option>Garden</option><option>Factory</option><option>Night City</option></select>
      <select id="mode"><option value="team">4vs4 チーム戦</option><option value="solo">個人戦</option></select>
      <button id="createBtn">部屋を作る</button>
    </section>
    <div id="status">サーバーへ接続中…</div>
  </div>
</div>

<div id="lobby" class="screen" hidden>
  <div class="panel lobbyPanel">
    <h2 id="roomTitle">ROOM</h2>
    <div id="members">参加者なし</div>
    <p id="lobbyStatus">待機中</p>
    <button id="startBtn">バトル開始</button>
    <button id="backBtn" class="danger">退出</button>
  </div>
</div>

<div id="hud" hidden>
  <div class="top"><b>INK ARENA</b><span>残り <strong id="time">3:00</strong></span><span>KO <strong id="score">0</strong></span></div>
  <div class="bottom"><span>HP <strong id="hp">100</strong></span><span>インク <strong id="ink">100</strong>%</span><span>SP <strong id="sp">0</strong>%</span><span id="weapon">SPLATTER</span></div>
</div>

<div id="result" class="screen" hidden>
  <div class="panel">
    <h1>RESULT</h1>
    <div id="resultText"></div>
    <button id="again">ロビーへ戻る</button>
    <button id="rematch">もう一度バトル</button>
  </div>
</div>

<div id="cross"></div>
<script src="game.js"></script>
</body>
</html>
